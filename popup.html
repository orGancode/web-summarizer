<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 网页总结</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- 头部 -->
    <header>
      <h1>📝 AI 网页总结</h1>
      <button id="settingsBtn" class="icon-btn" title="设置">⚙️</button>
    </header>
    
    <!-- 状态显示 -->
    <div id="status" class="status">
      <span class="loading-spinner hidden"></span>
      <span id="statusText">点击按钮开始总结</span>
    </div>
    
    <!-- 操作按钮 -->
    <div class="actions">
      <button id="summarizeBtn" class="primary-btn">
        <span class="btn-icon">✨</span>
        总结当前页面
      </button>
      <button id="copyBtn" class="secondary-btn hidden">
        📋 复制结果
      </button>
    </div>
    
    <!-- 结果展示 -->
    <div id="result" class="result hidden">
      <!-- 一句话总结 -->
      <section class="oneline-section hidden" id="oneLineSection">
        <p id="oneLineSummary" class="oneline-summary"></p>
      </section>
      
      <!-- 核心总结 -->
      <section class="summary-section">
        <h3>🎯 核心观点</h3>
        <p id="summaryText" class="summary-text"></p>
      </section>
      
      <!-- 关键要点 -->
      <section class="keypoints-section">
        <h3>🔑 关键要点</h3>
        <ul id="keyPointsList" class="keypoints-list"></ul>
      </section>
      
      <!-- 实用建议 -->
      <section class="tips-section hidden" id="tipsSection">
        <h3>💡 实用建议</h3>
        <ul id="practicalTips" class="tips-list"></ul>
      </section>
      
      <!-- 延伸思考 -->
      <section class="thinking-section hidden" id="thinkingSection">
        <h3>🤔 延伸思考</h3>
        <p id="deepThinking" class="thinking-text"></p>
      </section>
      
      <!-- 元信息 -->
      <div class="meta">
        <span id="tokenCount"></span>
        <span id="timeCost"></span>
      </div>
    </div>
    
    <!-- 错误提示 -->
    <div id="error" class="error hidden">
      <p id="errorText"></p>
      <button id="retryBtn" class="secondary-btn">重试</button>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
